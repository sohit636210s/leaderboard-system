<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POST GET METHOD OVERVIEW</title>
</head>
<body>
  <form action="" method="post">

    <table border="1px" width="60%" align="center" cellpadding="10px" cellspacing="10px">
        <tr>
          <th colspan="2"> REGISTRATION FORM</th>
        </tr>


        <tr>
          <th>First Name</th>
          <th><input type="text" name="fname"></th>
        </tr>

        <tr>
          <th>Username</th>
          <th><input type="email" name="username"></th>
        </tr>

        <tr>
          <th>Password</th>
          <th>
            <input type="password" name="password">
          </th>
        </tr>

        <tr>
          <th>Gender</th>
          <th><input type="radio" name="gender" value="male"> Male 
          <input type="radio" name="gender" value="female"> Male</th>
        </tr>

        <tr>
          <th>
            <input type="submit" name="submit" value="REGISTER">
          </th>
        </tr>
    </table>
  </form>
</body>
</html>
